name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $ver = $env:GITHUB_REF_NAME.TrimStart("v")
          } else {
            $ver = "0.0.0-dev"
          }
          "version=$ver" >> $env:GITHUB_OUTPUT

      # The .slnx solution lives in src/, not the repo root - `dotnet test` from the
      # working directory would fail with "no project found" otherwise.
      - name: Test
        if: matrix.rid == 'win-x64'
        run: dotnet test src/StickyNotesMcp.slnx -c Release

      - name: Publish
        run: >
          dotnet publish src/StickyNotesMcp.csproj -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.version }}
          -o publish

      # Only the actual published single-file exe proves reflection-based tool discovery,
      # EF Core, and the self-extracting native SQLite library all still work together -
      # none of that is exercised by `dotnet build` or `dotnet test`.
      - name: Smoke test (win-x64 only)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = (Resolve-Path "publish\StickyNotesMcp.exe")
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $proc = [System.Diagnostics.Process]::Start($psi)

          $request = '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"release-smoke-test","version":"0.0.0"}}}'
          $proc.StandardInput.WriteLine($request)
          $proc.StandardInput.Flush()

          $readTask = $proc.StandardOutput.ReadLineAsync()
          $completed = $readTask.Wait(15000)

          if (-not $completed) {
            Write-Error "StickyNotesMcp.exe did not respond to 'initialize' within 15s"
            if (-not $proc.HasExited) { $proc.Kill() }
            exit 1
          }

          $response = $readTask.Result
          Write-Host "Response: $response"

          if (-not $proc.HasExited) { $proc.Kill() }

          if ($response -notmatch "serverInfo") {
            Write-Error "Response did not contain 'serverInfo': $response"
            exit 1
          }

          Write-Host "Smoke test passed."

      - name: Rename and hash
        shell: pwsh
        run: |
          $asset = "publish\StickyNotesMcp-${{ matrix.rid }}.exe"
          Move-Item "publish\StickyNotesMcp.exe" $asset
          $hash = Get-FileHash -Algorithm SHA256 $asset
          "$($hash.Hash.ToLower())  StickyNotesMcp-${{ matrix.rid }}.exe" | Out-File -Encoding ascii "$asset.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.rid }}
          path: |
            publish/StickyNotesMcp-${{ matrix.rid }}.exe
            publish/StickyNotesMcp-${{ matrix.rid }}.exe.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: assets/*
          generate_release_notes: true
          draft: false
