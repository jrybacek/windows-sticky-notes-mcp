version: 2
updates:
  - package-ecosystem: "nuget"
    directories:
      - "/src"
      - "/tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.EntityFrameworkCore.*"
          - "Microsoft.Data.Sqlite"
      test-dependencies:
        patterns:
          - "xunit*"
          - "Microsoft.NET.Test.Sdk"
          - "coverlet.*"
    commit-message:
      prefix: "⬆️ chore(deps)"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "⬆️ chore(ci)"
